<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f3e3cc">
<title>Quán Cà Phê Nhỏ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<header id="hud">
  <button id="setBtn" class="icb ghosty" aria-label="Cài đặt"></button>
  <div class="h-shop"><b id="hShop">Quán Cà Phê Nhỏ</b><small id="hLoc"></small></div>
  <div class="h-m" id="hMoneyBox"><i id="hCoin"></i><div><span id="hMoney">0</span><small id="hRate"></small></div></div>
</header>
<button id="goal" hidden></button>
<div id="labels"></div>
<div id="bubbles"></div>
<nav id="nav">
  <button id="navUpg"><span>Nâng cấp</span><b class="bdg" hidden></b></button>
  <button id="navTask" class="mid"><span>Nhiệm vụ</span><b class="bdg" hidden></b></button>
  <button id="navShop"><span>Quán</span><b class="bdg" hidden></b></button>
</nav>
<div id="sheet" hidden><div class="sheet-card" id="sheetCard"></div></div>
<div id="toasts"></div>
<div id="flash"></div>
<div id="curtain" hidden></div>
<div id="modal" hidden><div class="card" id="card"></div></div>
<div id="splash">
  <div class="sp-in">
    <div class="logo"></div>
    <h1>Quán Cà Phê Nhỏ</h1>
    <p class="tap">Chạm để mở quán</p>
  </div>
</div>
<script type="module">
  import { boot } from './src/game.js';
  boot();
</script>
</body>
</html>
