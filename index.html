<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f3e3cc">
<title>Quán Cà Phê Nhỏ</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-48.png" type="image/png" sizes="48x48">
<!-- Thêm vào màn hình chính: iPhone/iPad dùng apple-touch-icon và các thẻ apple-*, Android dùng manifest -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quán Cà Phê">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }</script>
</head>
<body class="pre">
<canvas id="c"></canvas>
<header id="hud">
  <button id="setBtn" class="icb ghosty" aria-label="Cài đặt"></button>
  <div class="h-shop"><b id="hShop">Quán Cà Phê Nhỏ</b><small id="hLoc"></small></div>
  <div class="h-g" id="hGemBox" hidden><i id="hGem"></i><span id="hGems">0</span></div>
  <div class="h-m" id="hMoneyBox"><i id="hCoin"></i><div><span id="hMoney">0</span><small id="hRate"></small></div></div>
</header>
<button id="goal" hidden></button>
<div id="labels"></div>
<div id="bubbles"></div>
<nav id="nav">
  <button id="navUpg"><span>Nâng cấp</span><b class="bdg" hidden></b></button>
  <button id="navVault" hidden><span>Kho báu</span><b class="bdg" hidden></b></button>
  <button id="navTask" class="mid"><span>Nhiệm vụ</span><b class="bdg" hidden></b></button>
  <button id="navShop"><span>Quán</span><b class="bdg" hidden></b></button>
</nav>
<button id="boostBtn" hidden aria-label="Tăng tốc"><i class="bb-ring"></i><i class="bb-ic"></i><b id="boostTx">×2</b></button>
<div id="sheet" hidden><div class="sheet-card" id="sheetCard"></div></div>
<div id="toasts"></div>
<div id="flash"></div>
<div id="curtain" hidden></div>
<div id="modal" hidden><div class="card" id="card"></div></div>
<div id="splash">
  <div class="sp-in">
    <div class="logo"><img src="icons/icon.svg" alt=""></div>
    <h1>Quán Cà Phê Nhỏ</h1>
    <p class="sp-wait" id="spWait">Đang mở cửa…</p>
    <button class="enter" id="enterBtn" hidden>Vào quán thôi!</button>
  </div>
</div>
<script type="module">
  import { boot } from './src/game.js';
  boot();
</script>
</body>
</html>
